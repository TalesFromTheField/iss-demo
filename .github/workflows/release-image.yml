---
name: Release Image
run-name: 'Publish container image on release: ${{ github.event.release.tag_name }}'

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.image.outputs.uri }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build tags
        id: tags
        run: |
          TAGS="${{ env.IMAGE_REGISTRY }}/${{ steps.repo.outputs.name }}:latest"
          TAGS="${TAGS}
          ${{ env.IMAGE_REGISTRY }}/${{ steps.repo.outputs.name }}:${{ github.sha }}"
          
          # Only add release tag if this is triggered by a release event
          if [ "${{ github.event_name }}" = "release" ]; then
            TAGS="${TAGS}
          ${{ env.IMAGE_REGISTRY }}/${{ steps.repo.outputs.name }}:${{ github.event.release.tag_name }}"
          fi
          
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.release.created_at }}

      - name: Output image URI
        id: image
        run: |
          echo "uri=${{ env.IMAGE_REGISTRY }}/${{ steps.repo.outputs.name }}:latest" >> $GITHUB_OUTPUT
          echo "Built and pushed: ${{ env.IMAGE_REGISTRY }}/${{ steps.repo.outputs.name }}:latest"
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "Also tagged with: ${{ github.event.release.tag_name }}"
          fi
