name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      containerImageUri:
        description: 'Container image URI to deploy (leave blank for latest GHCR image)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read
  packages: write

env:
  AZURE_RESOURCE_GROUP: rg-iss-demo-dev
  AZURE_LOCATION: eastus2
  IMAGE_REGISTRY: ghcr.io

jobs:
  build-image:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ steps.repo.outputs.name }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ steps.repo.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push bootstrap image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: scripts/bootstrap.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ steps.repo.outputs.name }}-bootstrap:latest
            ${{ env.IMAGE_REGISTRY }}/${{ steps.repo.outputs.name }}-bootstrap:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Output image URI
        id: image
        run: echo "uri=${{ env.IMAGE_REGISTRY }}/${{ steps.repo.outputs.name }}:latest" >> $GITHUB_OUTPUT

  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build-image
    environment: dev
    outputs:
      containerAppName: ${{ steps.deploy.outputs.containerAppName }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group if not exists
        run: |
          az group create \
            --name ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }} \
            --output none

      - name: Deploy Bicep
        id: deploy
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ADMIN_EMAIL: ${{ secrets.AZURE_ADMIN_EMAIL }}
        run: |
          # Determine image URI: use workflow_dispatch input if provided, otherwise use image built above
          IMAGE_URI="${{ inputs.containerImageUri }}"
          if [ -z "$IMAGE_URI" ]; then
            IMAGE_URI="${{ needs.build-image.outputs.image-uri }}"
          fi

          OUTPUT=$(az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
                         containerImageUri="$IMAGE_URI" \
            --name "iss-demo-$(date +%Y%m%d-%H%M%S)" \
            --query "properties.outputs" -o json)

          echo "containerAppName=$(echo $OUTPUT | jq -r '.containerAppName.value // "ca-iss-dev"')" >> $GITHUB_OUTPUT

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: dev
    env:
      CONTAINER_APP_NAME: ${{ needs.deploy-infra.outputs.containerAppName }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Container App is running
        run: |
          echo "Checking Container App: $CONTAINER_APP_NAME"
          STATUS=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.runningStatus" -o tsv 2>/dev/null || echo "Unknown")
          echo "Container App running status: $STATUS"
          if [ "$STATUS" = "Stopped" ]; then
            echo "::error::Container App is stopped"
            exit 1
          fi
          echo "✅ Container App status: $STATUS"

      - name: Verify Container App replicas
        run: |
          REPLICAS=$(az containerapp replica list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "length(@)" -o tsv 2>/dev/null || echo "0")
          echo "Running replicas: $REPLICAS"
          if [ "${REPLICAS:-0}" -eq 0 ]; then
            echo "::warning::No running replicas detected — app may still be starting up"
          else
            echo "✅ $REPLICAS replica(s) running"
          fi

      - name: Verify data flowing to Fabric (wait for first events)
        run: |
          echo "Waiting 90s for Container App to start streaming to Fabric..."
          sleep 90

          # Check Container App logs for successful Fabric ingestion
          LOGS=$(az containerapp logs show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --tail 50 2>/dev/null || echo "")

          if echo "$LOGS" | grep -q "send_to_fabric\|Ingested\|ISS_Loc\|Astronauts"; then
            echo "✅ Fabric ingestion activity detected in Container App logs"
          else
            echo "::warning::No Fabric ingestion log entries found yet — app may still be warming up"
            echo "Check Container App logs manually: az containerapp logs show --name $CONTAINER_APP_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }}"
          fi

          echo "✅ Smoke test complete"
