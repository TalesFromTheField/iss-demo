name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-iss-demo-dev
  AZURE_LOCATION: eastus2
  REGISTRY_NAME: acrissdev
  IMAGE_NAME: iss-demo
  IMAGE_TAG: latest

jobs:
  deploy-infra:
    name: Deploy Infrastructure (ACR + Container App skeleton)
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      registry-url: ${{ steps.deploy.outputs.registry-url }}
      container-app-name: ${{ steps.deploy.outputs.containerAppName }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep Infrastructure (ACR + Container App)
        id: deploy
        run: |
          # Deploy infrastructure without container image (image deployed in next job)
          DEPLOY_OUTPUT=$(az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters \
              containerImageUri="" \
              acrLoginServer="" \
              acrAdminUsername="" \
              acrAdminPassword="" \
              eventHubConnectionString="" \
            --name "iss-demo-$(date +%Y%m%d-%H%M%S)" \
            --query "properties.outputs" -o json)
          
          # Extract registry URL and container app name
          REGISTRY_URL=$(echo "$DEPLOY_OUTPUT" | jq -r '.acrLoginServer.value' 2>/dev/null || echo "")
          CONTAINER_APP_NAME=$(echo "$DEPLOY_OUTPUT" | jq -r '.containerAppName.value' 2>/dev/null || echo "ca-iss-dev")
          
          echo "registry-url=${REGISTRY_URL}" >> $GITHUB_OUTPUT
          echo "containerAppName=${CONTAINER_APP_NAME}" >> $GITHUB_OUTPUT

  build-image:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: dev
    outputs:
      image-uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (OIDC)
        run: |
          ACR_ACCESS_TOKEN=$(az acr login \
            --name ${{ env.REGISTRY_NAME }} \
            --expose-token \
            --query accessToken -o tsv)
          
          echo "${ACR_ACCESS_TOKEN}" | docker login ${{ needs.deploy-infra.outputs.registry-url }} \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          registry: ${{ needs.deploy-infra.outputs.registry-url }}
          tags: |
            ${{ needs.deploy-infra.outputs.registry-url }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ needs.deploy-infra.outputs.registry-url }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Output image URI
        id: image
        run: |
          echo "uri=${{ needs.deploy-infra.outputs.registry-url }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

  update-container-app:
    name: Update Container App with Image
    runs-on: ubuntu-latest
    needs: [deploy-infra, build-image]
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          # Get Event Hub connection string from existing namespace
          EH_CONN=$(az eventhubs namespace authorization-rule keys list \
            --name RootManageSharedAccessKey \
            --namespace-name evhns-iss-dev \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query primaryConnectionString -o tsv 2>/dev/null || echo "")
          
          # Update the Container App with the new image and Event Hub connection
          az containerapp update \
            --name ${{ needs.deploy-infra.outputs.container-app-name }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ needs.build-image.outputs.image-uri }} \
            --set-env-vars "EventHubConnection=${EH_CONN}" "IssLocationHubName=iss-location" "AstronautsHubName=astronauts"

  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [build-image, deploy-infra]
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Container App is healthy
        run: |
          echo "Checking Container App status..."
          STATUS=$(az containerapp show \
            --name ${{ needs.deploy-infra.outputs.container-app-name }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.provisioningState" -o tsv)
          echo "Container App provisioning state: $STATUS"
          if [ "$STATUS" != "Succeeded" ]; then
            echo "::error::Container App is not healthy (state: $STATUS)"
            exit 1
          fi
          echo "✅ Container App is provisioned and healthy"

      - name: Verify events reaching Event Hubs
        run: |
          echo "Waiting 30s for container to start and begin sending events..."
          sleep 30
          
          NAMESPACE="evhns-iss-dev"
          
          for HUB in "iss-location" "astronauts"; do
            echo "Checking Event Hub: $HUB..."
            # Check if the hub has received messages by querying metrics
            INCOMING=$(az monitor metrics list \
              --resource "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.AZURE_RESOURCE_GROUP }}/providers/Microsoft.EventHub/namespaces/$NAMESPACE/eventhubs/$HUB" \
              --metric "IncomingMessages" \
              --interval PT1M \
              --query "value[0].timeseries[0].data[-1].total" -o tsv 2>/dev/null || echo "0")
            echo "  Incoming messages for $HUB: $INCOMING"
            if [ "${INCOMING:-0}" = "0" ] || [ "$INCOMING" = "None" ]; then
              echo "::warning::No incoming messages detected for $HUB yet (may need more time)"
            else
              echo "  ✅ Events flowing to $HUB"
            fi
          done
          
          echo "✅ Smoke test complete"
