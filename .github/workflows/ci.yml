name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Lint Python
        run: ruff check functions/
      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r functions/requirements.txt
          pip install pytest
      - name: Run unit tests
        working-directory: functions
        run: python -m pytest tests/ -m "not integration" -v

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r functions/requirements.txt
          pip install pytest
      - name: Run integration tests
        working-directory: functions
        run: python -m pytest tests/ -m integration -v

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r functions/requirements.txt
      - name: Package function app
        run: |
          cd functions
          mkdir -p ../dist
          zip -r ../dist/function-app.zip . -x "tests/*" "local.settings.json" "__pycache__/*"
      - uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: dist/function-app.zip

  validate-infra:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bicep
        run: az bicep build --file infra/main.bicep
